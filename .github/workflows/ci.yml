name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ever_after
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DJANGO_LOAD_DOTENV: "false"
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-django-secret-used-for-disposable-tests-not-production
      DJANGO_MEDIA_ROOT: ${{ runner.temp }}/ever-after-media
      DATABASE_URL: postgresql://postgres:ci-only-postgres-password@127.0.0.1:5432/ever_after?sslmode=disable
      DJANGO_API_ORIGIN: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm --prefix frontend ci --include=dev
      - name: Audit production dependencies
        run: |
          python -m pip_audit -r backend/requirements.txt --progress-spinner off
          npm --prefix frontend audit --omit=dev --audit-level=moderate
      - name: Validate Render Blueprint
        run: >-
          python -c "import json,pathlib,urllib.request,yaml,jsonschema;
          schema=json.load(urllib.request.urlopen('https://render.com/schema/render.yaml.json'));
          jsonschema.validate(yaml.safe_load(pathlib.Path('render.yaml').read_text()),schema)"
      - name: Backend tests and migrations
        run: |
          python backend/manage.py test stories --noinput
          python backend/manage.py makemigrations --check --dry-run
      - name: Production configuration and WSGI checks
        working-directory: backend
        env:
          RENDER: "true"
          DJANGO_DEBUG: "false"
          DJANGO_TRUST_PROXY: "true"
          PUBLIC_SITE_URL: https://ever-after-test.onrender.com
          DJANGO_INTERNAL_HOST: ever-after-api.internal
        run: |
          bash predeploy.sh
          python -m gunicorn config.wsgi:application --config gunicorn.conf.py --check-config
      - name: Frontend lint and build
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run build
          npm --prefix frontend run typecheck
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser and signal tests
        run: npm --prefix frontend test
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics
          path: frontend/test-results/
          retention-days: 7
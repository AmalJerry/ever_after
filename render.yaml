services:
  - type: web
    name: ever-after-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_TRUST_PROXY
        value: "true"
      - key: DJANGO_ALLOW_EPHEMERAL_SQLITE
        value: "true"
      - key: DJANGO_SQLITE_PATH
        value: /tmp/ever-after/db.sqlite3
      - key: DJANGO_MEDIA_ROOT
        value: /tmp/ever-after/media
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_CMD_ARGS
        value: ""

  - type: web
    name: ever-after
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_API_ORIGIN
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
